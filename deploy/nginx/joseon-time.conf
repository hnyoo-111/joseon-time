# joseon-time.gaia3d.dev — 189 서버 nginx (컨테이너 :80 → 호스트 :4001)
#
# 이 파일이 유일한 nginx 설정이다. compose 가 /etc/nginx/conf.d/joseon-time.conf 로 마운트한다.
# 편집은 반드시 소스 트리(<repo>/deploy/nginx/)에서 한다 — /data/joseon-time 쪽이 아니다.
#
# TLS 는 여기서 다루지 않는다. Cloudflare 가 종단하고, 같은 대역의 별도 호스트에서 도는
# cloudflared 가 http://192.168.10.189:4001 로 넘겨준다. 그래서 listen 80 뿐이고 인증서가 없다.
# (구 certbot·TLS 전용 설정 joseon-time.conf 와 터널용 joseon-time.tunnel.conf 로 나뉘어 있던 것을
#  2026-08-13 에 이 파일 하나로 합쳤다. 두 벌을 유지하다 엉뚱한 쪽을 고치는 사고를 막기 위함이다.)
#
# 모든 location 은 컨테이너 로컬 파일시스템에서 해결된다 — 외부로 나가는 프록시가 없다.
#   /            → app/                      (신규 SPA. /map 등은 index.html 폴백)
#   /raw-asset/  → raw/                      (스케줄러가 원천에서 직접 받은 원본 gltf)
#   /asset/      → releases/current/asset/   (build_release.mjs 최적화본)
#   /data/       → releases/current/data/

# 터널 경유 시 모든 요청의 remote_addr 이 cloudflared 컨테이너 IP 로 보인다.
# 속도 제한·핫링크는 Cloudflare 가 붙여 주는 CF-Connecting-IP(실제 클라이언트 IP) 기준으로 건다.
map $http_cf_connecting_ip $joseon_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;            # 터널 밖(내부 점검 curl 등)은 원래 주소로
}

limit_req_zone  $joseon_client_ip zone=joseon_req:10m rate=30r/s;
limit_conn_zone $joseon_client_ip zone=joseon_conn:10m;

# 정적 자산 전용 완화 존 — raw gltf 모델 하나가 텍스처를 30~40장 동시에 요청한다.
# 페이지 기준 속도제한(30r/s)을 그대로 두면 모델 로딩이 통째로 503 이 된다(2026-08-13 실측).
limit_req_zone  $joseon_client_ip zone=joseon_static:10m rate=300r/s;
limit_conn_zone $joseon_client_ip zone=joseon_static_conn:10m;

# 핫링크 완화: 자기 도메인·직접 진입(빈 Referer)만 에셋 허용
map $http_referer $joseon_hotlink {
    default                              1;
    ""                                   0;   # 직접 진입·프리페치는 허용
    "~*^https?://joseon-time\.gaia3d\.dev" 0;
    "~*^https://hnyoo-111\.github\.io"   0;   # GitHub Pages 배포본
    "~*^https://joseon-time\.vercel\.app" 0;  # Vercel 프로덕션 배포본
    "~*^https?://localhost"              0;
    "~*^https?://127\.0\.0\.1"           0;
    "~*^https?://192\.168\."             0;   # 사내망 직결(예: http://192.168.10.189:4001) — 없으면 에셋이 403
}

# 에셋 CORS 허용 오리진 — Pages 배포본은 교차 출처로 /asset/ 을 호출한다.
map $http_origin $joseon_cors_origin {
    default                                 "";
    "~*^https://joseon-time\.gaia3d\.dev$"  $http_origin;
    "~*^https://hnyoo-111\.github\.io$"     $http_origin;
    "~*^https://joseon-time\.vercel\.app$"  $http_origin;
    "~*^http://localhost(:[0-9]+)?$"        $http_origin;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name joseon-time.gaia3d.dev;

    # 문서 루트는 SPA 배포본(app/). 에셋·데이터는 아래 location 에서 릴리스/raw 로 보낸다.
    # 앱 배포와 에셋 릴리스를 분리해 두면 앱 교체가 릴리스 빌드를 기다리지 않는다.
    root /srv/joseon-time/app;
    disable_symlinks off;
    autoindex off;
    server_tokens off;

    # 브라우저는 Cloudflare 를 통해 HTTPS 로 보므로 HSTS 유지
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # CSP — [중요] 반드시 한 줄로 쓴다.
    # 역슬래시로 줄을 이으면 HTTP 헤더 폴딩(obs-fold)이 되어 브라우저가 첫 줄만 읽는다.
    # 그러면 CSP 가 default-src 'self' 한 줄로 축약돼 Cesium 이 통째로 차단된다(2026-08-13 실측).
    #  - 'unsafe-eval': Cesium 에 번들된 Knockout 3.5.1 이 (0,eval)("this") 를 실행한다. 빼면 Cesium 이 뜨지 않는다.
    #                   WebAssembly(Basis/Draco) 컴파일도 이 값으로 함께 허용된다.
    #  - 'unsafe-inline'(script): 구 joseon_time.html 이 단일 파일 인라인 스크립트라서 필요. 구 페이지 폐기 시 제거 가능.
    #  - blob: (script-src): Cesium 워커가 importScripts('blob:...') 로 지형 메시 워커를 올린다.
    #                        worker-src 만으로는 부족하다. 빼면 지형/지도가 통째로 렌더링되지 않는다(2026-08-13 실측).
    #  - media.sketchfab.com (img-src): 유물 카드 썸네일이 Sketchfab CDN 에서 온다.
    #                        189 서버로 내려받아 자체 서빙하면 이 항목을 지울 수 있다.
    #  - static.cloudflareinsights.com: Cloudflare 가 자동 주입하는 Web Analytics 비콘.
    #                        CF 대시보드에서 비활성화하면 이 항목도 지워도 된다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdnjs.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.cesium.com https://media.sketchfab.com; connect-src 'self' https://api.cesium.com https://assets.ion.cesium.com https://*.cesium.com https://tile.openstreetmap.org https://cdnjs.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    limit_req  zone=joseon_req burst=60 nodelay;
    limit_conn joseon_conn 24;

    access_log /var/log/nginx/joseon-time.access.log;
    error_log  /var/log/nginx/joseon-time.error.log;

    # json·html 만 압축. glb/ktx2 는 이미 압축돼 있어 재압축은 CPU만 쓴다(설계 §5).
    gzip on;
    gzip_types application/json application/geo+json text/css application/javascript;  # text/html 은 nginx 가 항상 처리(중복 지정 시 warn)
    gzip_min_length 1024;

    # [주의] nginx 는 하위 레벨에 add_header 가 하나라도 있으면 상위 레벨 add_header 를 전부 버린다.
    # 그래서 캐시 지정은 add_header 대신 expires 를 쓴다(상속을 깨지 않는다).
    # CORS 때문에 add_header 가 반드시 필요한 두 블록에서만 보안 헤더를 다시 선언한다.

    # 에셋 — 릴리스 경로는 불변이므로 1년 immutable. 갱신은 릴리스 교체로(D-10).
    location /asset/ {
        limit_req  zone=joseon_static burst=600 nodelay;
        limit_conn joseon_static_conn 64;
        if ($joseon_hotlink) { return 403; }
        alias /srv/joseon-time/releases/current/asset/;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin $joseon_cors_origin always;
        add_header Vary Origin always;
        types { model/gltf-binary glb; image/ktx2 ktx2; model/gltf+json gltf; application/octet-stream bin; }
    }

    # 스케줄러 원본(raw) 직접 서빙 — 최적화 릴리스를 기다리지 않고 수집분을 바로 표출한다.
    # D-08(raw 미서빙)에서 의도적으로 벗어난 경로다. 원본 gltf+png 라 릴리스 대비 수십 배 무겁고,
    # 스케줄러가 덮어쓰므로 immutable 캐시를 걸 수 없다.
    location /raw-asset/ {
        limit_req  zone=joseon_static burst=600 nodelay;
        limit_conn joseon_static_conn 64;
        if ($joseon_hotlink) { return 403; }
        alias /srv/joseon-time/raw/;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin $joseon_cors_origin always;
        add_header Vary Origin always;
        types {
            model/gltf+json gltf; application/octet-stream bin;
            image/png png; image/jpeg jpg jpeg; image/ktx2 ktx2; model/gltf-binary glb;
        }
    }

    # 데이터 파일 — 릴리스마다 바뀌므로 짧게.
    location /data/ {
        alias /srv/joseon-time/releases/current/data/;
        expires 5m;
    }

    # Vite 해시 파일명·Cesium 정적 자산 — 파일명에 해시가 있어 길게 캐시해도 안전하다.
    location /assets/ { expires 1y; limit_req zone=joseon_static burst=600 nodelay; }
    location /cesium/ { expires 1y; limit_req zone=joseon_static burst=600 nodelay; }

    # SPA — /map, /journey/:id 등은 실제 파일이 없으므로 index.html 로 넘긴다.
    location / {
        expires -1;                      # no-cache. 항상 최신 배포본을 가리키게.
        try_files $uri $uri/ /index.html;
    }
    location = /joseon_time.html { expires -1; }   # 구 페이지(비교용)
    location = /config.js        { expires -1; }

    # 서빙되면 안 되는 것들 (이중 안전장치 — 애초에 릴리스에 포함되지 않는다)
    location ~ /\.(env|git) { deny all; }
    location ~* \.(py|sh|mjs|log)$ { deny all; }

    location = /healthz { default_type text/plain; return 200 "ok\n"; }
}
